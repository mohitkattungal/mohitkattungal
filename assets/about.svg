<text x="46" y="66" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#aboutName)">Hi, I'm Mohit Kattungal.</text>
<text x="46" y="116" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#cbd5e1">I&#x27;m a final-year B.Tech student specializing in Data Science.</text><text x="46" y="145" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#cbd5e1">I enjoy working across the analytics workflow — from cleaning</text><text x="46" y="174" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#cbd5e1">and exploring data to writing SQL queries and building dashboards.</text><text x="46" y="203" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#cbd5e1">I also enjoy hackathons, practical experimentation and sharing</text><text x="46" y="232" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#cbd5e1">what I learn with other students.</text>
